[project]
name = "medgraph"
version = "0.1.0"
description = "Guideline-aware care-gap detection: GraphRAG over FHIR + medical ontologies"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=0.40",
    "neo4j>=5.20",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavy ML deps, kept out of the default install so CI stays fast.
extract = ["docling>=2.0", "transformers>=4.44", "torch>=2.3"]
embed = ["sentence-transformers>=3.0"]
graphrag = ["neo4j-graphrag>=1.0"]
demo = ["streamlit>=1.38", "pyvis>=0.3"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medgraph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "neo4j: needs a running Neo4j (docker compose up -d)",
    "llm: calls the Claude API (needs ANTHROPIC_API_KEY)",
]
addopts = "-m 'not neo4j and not llm'"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["medgraph"]
